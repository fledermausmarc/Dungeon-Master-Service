<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kartenschmiede – Oberweltkarten mit Stempeln</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--ink:#3a2a1c;--parch:#f1e6c8;--panel:#f7efd9;--edge:#c9b17a;--gold:#a8802c;--green:#33462a;--muted:#7a6a4e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b2418;color:var(--ink);font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif}
button,select,input{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:6px 10px;background:linear-gradient(#3d5232,#2c3d24);color:#f3e5bd;border-bottom:2px solid var(--gold)}
header h1{font-size:18px;margin:0;letter-spacing:.08em;font-variant:small-caps;white-space:nowrap}
header .sp{flex:1}
header button{background:rgba(255,255,255,.1);border:1px solid rgba(243,229,189,.4);border-radius:8px;padding:4px 9px;cursor:pointer;color:#f3e5bd}
header button:hover{background:rgba(255,255,255,.2)}
#main{flex:1;display:flex;min-height:0}
#side{width:300px;flex:none;background:var(--panel);border-right:2px solid var(--edge);display:flex;flex-direction:column;min-height:0}
#tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:6px;border-bottom:1px solid var(--edge)}
#tabs button{border:1px solid var(--edge);background:#efe3c2;border-radius:8px;padding:5px 2px;font-size:12.5px;cursor:pointer;line-height:1.15}
#tabs button.on{background:var(--green);color:#f3e5bd;border-color:var(--green)}
#tabs button b{display:block;font-size:17px}
#pane{flex:1;overflow-y:auto;padding:10px}
.lab{font-variant:small-caps;letter-spacing:.06em;font-weight:700;color:var(--muted);margin:10px 0 5px;font-size:13.5px}
.lab:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.grid.g4{grid-template-columns:repeat(4,1fr)}
.btn{border:1px solid var(--edge);background:#fbf5e4;border-radius:9px;padding:6px 4px;cursor:pointer;font-size:13px;text-align:center;line-height:1.15}
.btn:hover{border-color:var(--gold)}
.btn.on{background:#e7d39b;border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.btn.pri{background:var(--green);color:#f3e5bd;border-color:var(--green)}
.btn.wide{width:100%;margin-top:6px;padding:9px}
.stamp canvas{display:block;margin:0 auto 2px;width:44px;height:44px}
.stamp{padding:4px 2px;font-size:11.5px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.3);vertical-align:-2px;margin-right:4px}
.row{display:flex;gap:6px;align-items:center;margin:5px 0}
.row label{flex:none;font-size:13.5px;min-width:78px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--green)}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:0;border:1px solid var(--edge);border-radius:7px;padding:5px 7px;background:#fffdf5}
.row output{min-width:34px;text-align:right;font-size:13px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.35}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;margin:4px 0;cursor:pointer}
#stage{flex:1;overflow:auto;background:#3a3122 repeating-linear-gradient(45deg,transparent 0 12px,rgba(0,0,0,.06) 12px 24px);position:relative;min-width:0}
#wrap{margin:16px auto;width:max-content;box-shadow:0 6px 30px rgba(0,0,0,.6)}
#cv{display:block;touch-action:none;background:#efe2c0;cursor:crosshair}
#sel{position:absolute;left:10px;bottom:10px;background:var(--panel);border:2px solid var(--gold);border-radius:12px;padding:8px 10px;display:none;gap:6px;align-items:center;flex-wrap:wrap;max-width:calc(100% - 20px);box-shadow:0 4px 18px rgba(0,0,0,.4);font-size:13.5px}
#sel.show{display:flex}
#sel input[type=range]{width:110px;accent-color:var(--green)}
#zoom{position:absolute;right:10px;bottom:10px;display:flex;gap:4px}
#zoom button{width:38px;height:38px;border-radius:50%;border:1px solid var(--edge);background:var(--panel);cursor:pointer;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.4)}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--green);color:#f3e5bd;padding:8px 16px;border-radius:20px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:50;border:1px solid var(--gold)}
#toast.show{opacity:1}
#modal{position:fixed;inset:0;background:rgba(20,15,5,.75);display:none;align-items:center;justify-content:center;z-index:40;padding:14px}
#modal.show{display:flex}
#modal .box{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:14px;max-width:96vw;max-height:92vh;overflow:auto}
#modal img{max-width:88vw;max-height:70vh;display:block;margin:8px auto;border:1px solid var(--edge)}
@media (max-width:760px){
  #main{flex-direction:column-reverse}
  #side{width:100%;height:44%;border-right:0;border-top:2px solid var(--edge)}
  header h1{font-size:15px}
  #tabs{grid-template-columns:repeat(8,1fr)} #tabs button{font-size:0} #tabs button b{font-size:18px}
  .grid{grid-template-columns:repeat(4,1fr)} .grid.g4{grid-template-columns:repeat(5,1fr)}
}
@media print{header,#side,#zoom,#sel,#toast{display:none!important} #stage{overflow:visible;background:none} #wrap{box-shadow:none;margin:0} #cv{width:100%!important;height:auto!important} body{background:#fff}}
</style>
</head>

</div></div>
<div id="toast"></div>
<div id="modal"><div class="box" id="mbox"></div></div>

 hoehle:{n:'Höhle',g:'Orte',d:function(c){ c.beginPath(); c.moveTo(-18,12); c.quadraticCurveTo(-14,-14,0,-14); c.quadraticCurveTo(14,-14,18,12); c.closePath(); c.fillStyle=lg(c,-18,0,18,0,'#c9bb9d','#7a6c55'); c.fill(); ink(c,1.4); c.beginPath(); c.moveTo(-8,12); c.quadraticCurveTo(-7,-4,0,-4); c.quadraticCurveTo(7,-4,8,12); fill(c,'#1e1712'); }},

 leuchtturm:{n:'Leuchtturm',g:'Orte',d:function(c){ pth(c,[-6,14,-4,-8,4,-8,6,14],true); c.fillStyle=lg(c,-6,0,6,0,'#fbf6ea','#c9c0ae'); c.fill(); ink(c,1.2); pth(c,[-5,4,5,4,-4.5,-2,4.5,-2]); c.strokeStyle='#b5333a'; c.lineWidth=3; c.stroke(); pth(c,[-5,-8,-5,-14,5,-14,5,-8],true); fill(c,'#f5d66b'); ink(c,1.1); pth(c,[-6,-14,0,-19,6,-14],true); fill(c,'#b5333a'); }},
 bruecke:{n:'Brücke',g:'Orte',d:function(c){ c.beginPath(); c.moveTo(-18,4); c.quadraticCurveTo(0,-10,18,4); c.lineTo(18,9); c.quadraticCurveTo(0,-5,-18,9); c.closePath(); c.fillStyle=lg(c,0,-8,0,9,'#c9b48c','#8a7350'); c.fill(); ink(c,1.3); }},
 steinkreis:{n:'Steinkreis',g:'Orte',d:function(c){ for(var i=0;i<7;i++){ var a=i/7*Math.PI*2, x=Math.cos(a)*14, y=Math.sin(a)*7; pth(c,[x-2.5,y+4,x-2,y-5,x+2,y-5,x+2.5,y+4],true); c.fillStyle=lg(c,x-2,0,x+2,0,'#d6cebf','#8f877a'); c.fill(); ink(c,1); } }},
 portal:{n:'Portal',g:'Orte',d:function(c){ c.beginPath(); c.ellipse(0,0,10,15,0,0,7); c.fillStyle=rg(c,0,0,15,'#e3d6ff','#5b3fb0'); c.fill(); ink(c,1.4); }},
 /* Meer */

 seeschlange:{n:'Seeschlange',g:'Meer',d:function(c){ c.beginPath(); c.moveTo(-22,6); c.bezierCurveTo(-16,-10,-10,-10,-6,6); c.moveTo(-2,6); c.bezierCurveTo(2,-8,8,-8,10,6); c.moveTo(14,6); c.quadraticCurveTo(14,-14,22,-12); c.lineWidth=6; c.strokeStyle='#4f7f5f'; c.stroke(); }},

 rundturm:{n:'Rundturm',g:'Gebäude',d:function(c){ c.beginPath(); c.arc(0,0,11,0,7); c.fillStyle=rg(c,0,0,11,'#d8cfbd','#7c7262',-4,-4); c.fill(); ink(c,1.3); c.beginPath(); c.arc(0,0,7,0,7); c.strokeStyle='rgba(0,0,0,.25)'; c.stroke(); }},

 brunnen:{n:'Brunnen',g:'Stadt',d:function(c){ c.beginPath(); c.arc(0,0,10,0,7); c.fillStyle=rg(c,0,0,10,'#d6d0c4','#8a8478',-3,-3); c.fill(); ink(c,1.3); c.beginPath(); c.arc(0,0,6.5,0,7); c.fillStyle=rg(c,0,0,6.5,'#9fd3e0','#3b7e98'); c.fill(); }},

 altar:{n:'Altar',g:'Dungeon',d:function(c){ c.beginPath(); c.rect(-16,-8,32,16); c.fillStyle=lg(c,-16,-8,16,8,'#d6d0c4','#8a8478'); c.fill(); ink(c,1.3); [-11,11].forEach(function(x){ c.beginPath(); c.arc(x,-3,3.2,0,7); fill(c,'rgba(255,210,120,.5)'); c.beginPath(); c.arc(x,-3,1.4,0,7); fill(c,'#ffe08a'); }); c.beginPath(); c.rect(-4,-1,8,6); fill(c,'#8a2a2a'); }},

 tisch:{n:'Tisch',g:'Einrichtung',d:function(c){ c.beginPath(); c.rect(-16,-9,32,18); c.fillStyle=texPat(c,'holz'); c.fill(); ink(c,1.2); [[-10,-14],[0,-14],[10,-14],[-10,14],[0,14],[10,14]].forEach(function(p){ c.beginPath(); c.arc(p[0],p[1],3,0,7); fill(c,'#7a5534'); ink(c,.8); }); }},

 fackel:{n:'Fackel',g:'Einrichtung',d:function(c){ c.beginPath(); c.arc(0,0,14,0,7); c.fillStyle=rg(c,0,0,14,'rgba(255,190,90,.55)','rgba(255,150,50,0)'); c.fill(); c.beginPath(); c.arc(0,0,3,0,7); fill(c,'#ffd56b'); }},

function roadDraw(c,kind,a,pf){ var L=30*(a||1);
  function shape(){ c.beginPath();
    if(kind==='gerade'){ c.moveTo(-L,0); c.lineTo(L,0); }
    else if(kind==='kurve'){ c.arc(-24,24,24,-Math.PI/2,0); }
    else if(kind==='kreuz'){ c.moveTo(-24,0); c.lineTo(24,0); c.moveTo(0,-24); c.lineTo(0,24); }
    else if(kind==='t'){ c.moveTo(-24,0); c.lineTo(24,0); c.moveTo(0,0); c.lineTo(0,24); }
    else if(kind==='ende'){ c.moveTo(-24,0); c.lineTo(8,0); } }
  c.lineCap=kind==='ende'?'round':'butt'; c.lineJoin='round';
  if(pf){ shape(); c.lineWidth=16; c.strokeStyle='#6a5a48'; c.stroke(); shape(); c.lineWidth=13; c.strokeStyle=texPat(c,'kopfstein'); c.stroke(); if(kind==='kreuz'||kind==='t'){ c.beginPath(); c.rect(-6.5,-6.5,13,13); c.fillStyle=texPat(c,'kopfstein'); c.fill(); } }
  else { shape(); c.lineWidth=8.5; c.strokeStyle='rgba(120,90,50,.8)'; c.stroke(); shape(); c.lineWidth=6.3; c.strokeStyle='#e6d3a0'; c.stroke(); if(kind==='kreuz'||kind==='t'){ c.beginPath(); c.rect(-3.15,-3.15,6.3,6.3); fill(c,'#e6d3a0'); } } }

function bindPane(){

function importImage(f){ var url=URL.createObjectURL(f), im=new Image(); im.onload=function(){ snap(true);
    var mx=3200, W=im.width, H=im.height; if(Math.max(W,H)>mx){ var q=mx/Math.max(W,H); W=Math.round(W*q); H=Math.round(H*q); } if(Math.max(W,H)<1000){ var q2=1000/Math.max(W,H); W=Math.round(W*q2); H=Math.round(H*q2); }
    S.type='bild'; S.setting=''; S.W=W; S.H=H; S.objs=[]; S.grid.type='keins'; S.frame=false; S.tint=true; S.stamp='ill_dorf'; S.path='feldweg'; S.label.kind='k_ort'; S.brush='klon'; elev=null; undo=[]; setSize(); tctx.drawImage(im,0,0,W,H); req(); commit(); tab='stamp'; S.tool='stamp'; ui();
    toast('Karte geladen. Stempel „Illustriert“ passen zum Pergamentstil.'); };
  im.onerror=function(){ toast('Bild nicht lesbar.'); }; im.src=url; }

function exportPng(bw){ selIdx=-1; showSel(); var c=document.createElement('canvas'); c.width=S.W; c.height=S.H; var x=c.getContext('2d'); render(x,true);
  if(bw){ var d=x.getImageData(0,0,S.W,S.H), D=d.data; for(var i=0;i<D.length;i+=4){ var l=D[i]*.3+D[i+1]*.59+D[i+2]*.11; l=255-(255-l)*1.15; D[i]=D[i+1]=D[i+2]=Math.max(0,Math.min(255,l)); } x.putImageData(d,0,0); }
